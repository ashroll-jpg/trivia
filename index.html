<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F3FB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brain Day">
<title>Don't Skip Brain Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3FB; --surface:#FFFFFF; --surface-2:#EFEAFA;
    --line:#E1D9F2; --text:#241C3A; --muted:#6B6188;
    --brain:#FF5FA6; --brain-2:#E24E93; --brain-hi:#FF9AC8;
    --band:#12C39A; --energy:#FFAE2B; --energy-d:#E08A00;
    --metal:#B4AAD4; --metal-2:#8478A6;
    --got:#12A86E; --got-bg:rgba(18,168,110,.14);
    --missed:#EF4E44; --missed-bg:rgba(239,78,68,.12);
    --display:"Anton", ui-sans-serif, system-ui, sans-serif;
    --body:"Nunito", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(900px 480px at 50% -6%, #FFE3EF 0%, var(--bg) 56%) fixed, var(--bg);
    color:var(--text); font-family:var(--body); font-weight:700; -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  .app{max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;
    padding:max(14px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom))}
  .screen{flex:1; display:none; flex-direction:column}
  .screen.active{display:flex}

  /* Illustrations */
  .ill{width:min(56vw,205px); height:auto; display:block; margin:0 auto}
  .an-press,.an-squat,.an-curlL,.an-curlR,.an-legA,.an-legB,.an-bob,.an-warm,.an-mo,
  .an-spark,.an-drop,.an-flex,.an-rope,.an-hop,.an-swing,.an-pushup,
  .an-jackArmL,.an-jackArmR,.an-jackLegL,.an-jackLegR{transform-box:view-box}
  @keyframes press{0%,100%{transform:translateY(7px)}50%{transform:translateY(-7px)}}
  .an-press{animation:press .85s ease-in-out infinite; transform-origin:100px 100px}
  @keyframes squat{0%,100%{transform:translateY(0)}50%{transform:translateY(15px)}}
  .an-squat{animation:squat .95s ease-in-out infinite; transform-origin:100px 100px}
  @keyframes curlL{0%,100%{transform:rotate(0)}50%{transform:rotate(-84deg)}}
  @keyframes curlR{0%,100%{transform:rotate(0)}50%{transform:rotate(84deg)}}
  .an-curlL{animation:curlL .85s ease-in-out infinite}
  .an-curlR{animation:curlR .85s ease-in-out infinite}
  @keyframes legA{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-26deg)}}
  @keyframes legB{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
  .an-legA{animation:legA .44s linear infinite}
  .an-legB{animation:legB .44s linear infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(-6deg)}}
  .an-bob{animation:bob .44s ease-in-out infinite; transform-origin:100px 100px}
  @keyframes warm{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .an-warm{animation:warm 1.3s ease-in-out infinite; transform-origin:100px 100px}
  @keyframes mo{0%,100%{opacity:.15}50%{opacity:.9}}
  .an-mo{animation:mo .44s ease-in-out infinite}
  .an-mo.m2{animation-delay:.06s}.an-mo.m3{animation-delay:.12s}
  @keyframes spark{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.35);opacity:1}}
  .an-spark{animation:spark 1.1s ease-in-out infinite}
  @keyframes drop{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(5px);opacity:.4}}
  .an-drop{animation:drop 1.6s ease-in-out infinite}
  @keyframes flex{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
  .an-flex{animation:flex 1.1s ease-in-out infinite; transform-origin:138px 96px}
  @keyframes rope{to{transform:rotate(360deg)}}
  .an-rope{animation:rope .6s linear infinite; transform-origin:100px 100px}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .an-hop{animation:hop .6s ease-in-out infinite; transform-origin:100px 100px}
  @keyframes swing{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-30deg)}}
  .an-swing{animation:swing .8s ease-in-out infinite}
  @keyframes jArmL{0%,100%{transform:rotate(0)}50%{transform:rotate(-125deg)}}
  @keyframes jArmR{0%,100%{transform:rotate(0)}50%{transform:rotate(125deg)}}
  @keyframes jLegL{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
  @keyframes jLegR{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
  .an-jackArmL{animation:jArmL .55s ease-in-out infinite}
  .an-jackArmR{animation:jArmR .55s ease-in-out infinite}
  .an-jackLegL{animation:jLegL .55s ease-in-out infinite}
  .an-jackLegR{animation:jLegR .55s ease-in-out infinite}
  @keyframes pushup{0%,100%{transform:translateY(0)}50%{transform:translateY(11px)}}
  .an-pushup{animation:pushup .9s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){ .ill *{animation:none !important} }

  /* Top bar */
  .topbar{display:flex; align-items:center; gap:10px; padding-top:2px}
  .brandmini{display:flex; align-items:center; gap:7px}
  .brandmini span{font-family:var(--display); font-size:15px; letter-spacing:.02em; color:var(--text)}
  .segs{flex:1; display:flex; gap:5px}
  .seg{flex:1; height:7px; border-radius:99px; background:var(--surface-2); transition:background .25s}
  .seg.cur{background:var(--brain)}
  .seg.got{background:var(--got)}
  .seg.missed{background:var(--missed)}
  .runscore{font-family:var(--display); font-size:16px; color:var(--brain-2); font-variant-numeric:tabular-nums; white-space:nowrap}

  /* Question */
  .qwrap{flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; padding:22px 0}
  .qmeta{display:flex; gap:8px; align-items:center}
  .chip{font-size:12px; color:var(--muted); border:1.5px solid var(--line); border-radius:99px; padding:4px 11px; font-weight:800}
  .chip.diff-hard{color:var(--missed); border-color:var(--missed)}
  .chip.diff-medium{color:var(--energy-d); border-color:var(--energy)}
  .q{font-family:var(--body); font-weight:900; font-size:clamp(22px,5.8vw,27px); line-height:1.25; margin:0}
  .anim{animation:rise .22s ease}
  @keyframes rise{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}

  /* Chunky game buttons */
  .choices{display:flex; flex-direction:column; gap:11px; padding-bottom:6px}
  .choice{
    width:100%; text-align:left; font-family:var(--body); font-weight:800; font-size:16px; line-height:1.35;
    color:var(--text); background:var(--surface); border:2px solid var(--line);
    border-radius:15px; padding:14px 15px; min-height:56px; cursor:pointer;
    display:flex; align-items:center; gap:12px; box-shadow:0 3px 0 var(--line);
    transition:border-color .12s, background .12s, transform .05s, box-shadow .05s;
    -webkit-tap-highlight-color:transparent;
  }
  .choice:hover:not(:disabled){border-color:var(--brain)}
  .choice:not(:disabled):active{transform:translateY(3px); box-shadow:0 0 0 var(--line)}
  .choice:disabled{cursor:default; box-shadow:none}
  .choice:focus-visible{outline:3px solid var(--brain); outline-offset:2px}
  .choice .key{flex:none; width:26px; height:26px; border-radius:8px; background:var(--surface-2); display:grid; place-items:center; font-family:var(--display); font-size:13px; color:var(--muted)}
  .choice.correct{background:var(--got-bg); border-color:var(--got)}
  .choice.correct .key{background:var(--got); color:#fff}
  .choice.wrong{background:var(--missed-bg); border-color:var(--missed)}
  .choice.wrong .key{background:var(--missed); color:#fff}
  .choice.dim{opacity:.5}

  .next{
    margin-top:12px; width:100%; appearance:none; cursor:pointer; font-family:var(--display);
    font-size:19px; letter-spacing:.02em; color:#3a2600; background:var(--energy);
    border:0; border-radius:15px; padding:15px; min-height:56px; box-shadow:0 4px 0 var(--energy-d);
    transition:transform .05s, box-shadow .05s; -webkit-tap-highlight-color:transparent;
  }
  .next:active{transform:translateY(4px); box-shadow:0 0 0 var(--energy-d)}
  .next:focus-visible{outline:3px solid var(--text); outline-offset:2px}
  .next.hidden{display:none}

  /* Centered screens */
  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px}
  .center p{color:var(--muted); margin:0; max-width:290px; font-weight:800}
  .wordmark{font-family:var(--display); font-size:clamp(30px,9vw,42px); line-height:.92; letter-spacing:.01em; margin:0}
  .wordmark .skip{color:var(--brain)}
  .big{font-family:var(--display); font-size:26px; color:var(--text)}

  /* Transition */
  .rep{font-family:var(--display); font-size:clamp(30px,10vw,46px); color:var(--brain-2); letter-spacing:.02em; margin-top:2px}
  .repline{font-size:17px; font-weight:900; color:var(--text); max-width:300px}
  .tap{font-size:12px; color:var(--muted); letter-spacing:.08em; margin-top:6px; text-transform:uppercase; font-weight:800}

  /* Results */
  .result{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:4px}
  .eyebrow{font-family:var(--display); font-size:14px; letter-spacing:.06em; color:var(--brain-2)}
  .bigscore{font-family:var(--display); font-size:clamp(64px,22vw,96px); line-height:.9; margin-top:2px}
  .bigscore .of{color:var(--muted); font-size:.5em}
  .verdict{font-family:var(--body); font-weight:900; font-size:19px; margin-top:6px; max-width:320px}
  .squares{font-size:26px; letter-spacing:4px; margin:8px 0 2px}
  .stats{display:flex; gap:10px; margin:16px 0 4px; width:100%}
  .stat{flex:1; background:var(--surface); border:2px solid var(--line); border-radius:15px; padding:12px 8px}
  .stat .n{font-family:var(--display); font-size:28px; color:var(--brain-2); font-variant-numeric:tabular-nums}
  .stat .l{font-size:12px; color:var(--muted); margin-top:3px; font-weight:800}
  .actions{display:flex; flex-direction:column; gap:10px; width:100%; margin-top:18px}
  .btn{appearance:none; cursor:pointer; font-family:var(--display); font-size:17px; letter-spacing:.02em; border-radius:15px; padding:14px; min-height:54px; border:2px solid var(--line); transition:transform .05s, box-shadow .05s; -webkit-tap-highlight-color:transparent}
  .btn.primary{background:var(--energy); color:#3a2600; border-color:var(--energy); box-shadow:0 4px 0 var(--energy-d)}
  .btn.primary:active{transform:translateY(4px); box-shadow:0 0 0 var(--energy-d)}
  .btn.ghost{background:var(--surface); color:var(--text); box-shadow:0 4px 0 var(--line)}
  .btn.ghost:active{transform:translateY(4px); box-shadow:0 0 0 var(--line)}
  .btn:focus-visible{outline:3px solid var(--brain); outline-offset:2px}
  .btn.copied{background:var(--got); border-color:var(--got); color:#fff; box-shadow:0 4px 0 #0c7a4f}
  .countdown{color:var(--muted); font-size:13px; margin-top:16px; font-variant-numeric:tabular-nums; font-weight:800}
  .countdown b{color:var(--text)}

  /* Archive */
  .backbtn{appearance:none; border:0; background:transparent; font-family:var(--display); font-size:30px; line-height:1; color:var(--text); cursor:pointer; padding:0 6px 4px 0; -webkit-tap-highlight-color:transparent}
  .archive{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:10px 0 20px}
  .archive-row{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left; font-family:var(--body); font-weight:800; font-size:16px; color:var(--text); background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:14px 16px; min-height:56px; cursor:pointer; box-shadow:0 3px 0 var(--line); transition:transform .05s, box-shadow .05s; -webkit-tap-highlight-color:transparent}
  .archive-row:active{transform:translateY(3px); box-shadow:none}
  .archive-row:hover{border-color:var(--brain)}
  .ar-status{font-family:var(--display); color:var(--muted); font-size:15px; white-space:nowrap}
  .ar-status.done{color:var(--got)}
  .archive-empty{color:var(--muted); text-align:center; margin-top:48px; padding:0 20px; font-weight:800}
</style>
</head>
<body>
<div class="app">

  <section class="screen" id="s-loading">
    <div class="center">
      <h1 class="wordmark">DON'T <span class="skip">SKIP</span><br>BRAIN DAY</h1>
      <div id="loadIll"></div>
      <p id="loadingMsg">Warming up&hellip;</p>
    </div>
  </section>

  <section class="screen" id="s-error">
    <div class="center">
      <div id="errIll"></div>
      <div class="big">THE GYM&rsquo;S CLOSED</div>
      <p id="errMsg">Couldn&rsquo;t load today&rsquo;s workout. Check your connection and give it another go.</p>
      <button class="btn primary" style="max-width:230px" onclick="retry()">TRY AGAIN</button>
    </div>
  </section>

  <section class="screen" id="s-play">
    <div class="topbar">
      <div class="brandmini" id="brandMini"><span>BRAIN DAY</span></div>
      <div class="segs" id="segs" aria-hidden="true"></div>
      <div class="runscore" id="runscore">0</div>
    </div>
    <div class="qwrap">
      <div class="qmeta"><span class="chip" id="chipCat"></span><span class="chip" id="chipDiff"></span></div>
      <h1 class="q" id="qText"></h1>
    </div>
    <div class="choices" id="choices"></div>
    <button class="next hidden" id="nextBtn" onclick="next()">NEXT REP</button>
  </section>

  <section class="screen" id="s-transition" onclick="advanceTrans()">
    <div class="center">
      <div id="transIll"></div>
      <div class="rep" id="transRep"></div>
      <div class="repline" id="transLine"></div>
      <div class="tap">tap to continue</div>
    </div>
  </section>

  <section class="screen" id="s-result">
    <div class="result">
      <div id="rIll"></div>
      <div class="eyebrow" id="rEyebrow"></div>
      <div class="bigscore" id="rScore"></div>
      <div class="verdict" id="rVerdict"></div>
      <div class="squares" id="rSquares" aria-hidden="true"></div>
      <div class="stats" id="rStats"></div>
      <div class="actions" id="rActions"></div>
      <div class="countdown" id="rCountdown"></div>
    </div>
  </section>

  <section class="screen" id="s-archive">
    <div class="topbar">
      <button class="backbtn" onclick="backToToday()" aria-label="Back">&lsaquo;</button>
      <div class="brandmini"><span>PAST DAYS</span></div>
    </div>
    <div class="archive" id="archiveList"></div>
  </section>

</div>

<script>
/* =========================================================================
   DON'T SKIP BRAIN DAY
   Fully self-contained: every day's 6-question set (3 easy, 2 medium, 1 hard)
   is generated from the built-in question bank using the calendar date. No
   server, no API, no internet needed once the page has loaded — and because
   the set is derived from the date, everyone on the team gets the SAME daily
   automatically, and "Past Days" can recompute any day back to ARCHIVE_START.

   To add/edit questions: edit the BANK object below (easy / medium / hard).
   Each entry is { q, a, w:[wrong,wrong,wrong], cat }.
   ========================================================================= */
const EPOCH = new Date(2026, 0, 1);        // day 0 for the daily sequence
const ARCHIVE_START = "2026-09-15";        // earliest day shown under "Past Days"
const ARCHIVE_MAX_ROWS = 180;              // how many past days to list

/* ---------- storage ---------- */
const KEY = "brainday_v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {days:{}}; } catch(e){ return {days:{}}; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} };
let store = load(); if(!store.days) store.days = {};

/* ---------- helpers ---------- */
const now = new Date();
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseYmd = s => { const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); };
const todayKey = ymd(now);
let currentDayId = todayKey, latestDayId = todayKey;
const el = id => document.getElementById(id);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.random()*a.length|0];
const make = (tag,cls,txt) => { const e=document.createElement(tag); e.className=cls; if(txt!=null) e.textContent=txt; return e; };
const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); el(id).classList.add("active"); }
const fmtShort = id => parseYmd(id).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const dayNumOf = id => Math.round((parseYmd(id) - EPOCH)/86400000);
const dayIdOf = n => ymd(new Date(EPOCH.getFullYear(), EPOCH.getMonth(), EPOCH.getDate()+n));

/* =========================================================================
   ILLUSTRATIONS — a cartoon brain that lifts
   ========================================================================= */
const M_SMILE  = '<path d="M89,98 Q100,107 111,98" fill="none" stroke="#2b1830" stroke-width="3.4" stroke-linecap="round"/>';
const M_EFFORT = '<ellipse cx="100" cy="100" rx="8" ry="6" fill="#2b1830"/>';
const M_GRIN   = '<path d="M87,95 Q100,113 113,95 Z" fill="#2b1830"/><path d="M91,98 Q100,105 109,98 Z" fill="#fff"/>';
const M_FLAT   = '<path d="M90,101 h20" stroke="#2b1830" stroke-width="3.4" stroke-linecap="round"/>';
const svg = inner => '<svg class="ill" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+inner+'</svg>';

const brainCore = (mouth) => `
  <g fill="var(--brain)">
    <ellipse cx="100" cy="84" rx="46" ry="34"/>
    <circle cx="66" cy="64" r="18"/><circle cx="88" cy="54" r="18"/>
    <circle cx="112" cy="54" r="18"/><circle cx="134" cy="64" r="18"/>
    <circle cx="54" cy="82" r="15"/><circle cx="146" cy="82" r="15"/>
  </g>
  <g fill="none" stroke="var(--brain-2)" stroke-width="3" stroke-linecap="round" opacity=".85">
    <path d="M100,56 Q95,74 100,90 Q104,104 100,112"/>
    <path d="M74,68 Q84,80 78,92"/><path d="M126,68 Q116,80 122,92"/>
  </g>
  <path d="M58,60 Q100,40 142,60" fill="none" stroke="var(--band)" stroke-width="11" stroke-linecap="round"/>
  <path d="M58,60 Q100,40 142,60" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".4"/>
  <circle cx="147" cy="63" r="5" fill="var(--band)"/>
  <path d="M151,60 l8,-4 M151,67 l8,4" stroke="var(--band)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="86" cy="87" r="4.6" fill="#2b1830"/><circle cx="114" cy="87" r="4.6" fill="#2b1830"/>
  <circle cx="87.6" cy="85.6" r="1.5" fill="#fff"/><circle cx="115.6" cy="85.6" r="1.5" fill="#fff"/>
  <circle cx="75" cy="97" r="5" fill="var(--brain-hi)" opacity=".7"/><circle cx="125" cy="97" r="5" fill="var(--brain-hi)" opacity=".7"/>
  ${mouth||M_SMILE}`;

const sneaker = (x,y) => `<g transform="translate(${x},${y})"><rect x="-5" y="0" width="27" height="9" rx="4.5" fill="#ffffff" stroke="var(--text)" stroke-width="1.6"/><rect x="-5" y="7.5" width="27" height="4" rx="2" fill="var(--brain-2)"/></g>`;
const legs = () => `
  <path d="M89,114 V148" stroke="var(--brain)" stroke-width="12" stroke-linecap="round"/>
  <path d="M111,114 V148" stroke="var(--brain)" stroke-width="12" stroke-linecap="round"/>
  ${sneaker(76,147)}${sneaker(98,147)}`;
const barbell = (cy) => `
  <rect x="46" y="${cy-4}" width="108" height="8" rx="4" fill="var(--metal)"/>
  <rect x="40" y="${cy-14}" width="12" height="28" rx="4" fill="var(--energy)"/>
  <rect x="148" y="${cy-14}" width="12" height="28" rx="4" fill="var(--energy)"/>
  <rect x="30" y="${cy-10}" width="10" height="20" rx="3" fill="var(--metal-2)"/>
  <rect x="160" y="${cy-10}" width="10" height="20" rx="3" fill="var(--metal-2)"/>`;
const dumbbell = (x,y) => `<g transform="translate(${x},${y})"><rect x="-4" y="-2" width="8" height="26" rx="4" fill="var(--metal)"/><circle cx="0" cy="-2" r="9" fill="var(--energy)"/><circle cx="0" cy="24" r="9" fill="var(--energy)"/></g>`;

const illPress = () => svg(`${legs()} ${brainCore(M_EFFORT)}
  <g class="an-press">
    <path d="M64,92 Q56,66 80,50" stroke="var(--brain)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M136,92 Q144,66 120,50" stroke="var(--brain)" stroke-width="11" stroke-linecap="round" fill="none"/>
    ${barbell(46)}
  </g>`);

const illCurl = () => svg(`${legs()}
  <path d="M62,96 L58,118" stroke="var(--brain)" stroke-width="11" stroke-linecap="round"/>

,{"q":"What is the most abundant element in the universe?","a":"Hydrogen","w":["Helium","Oxygen","Carbon"],"cat":"Science"},{"q":"Which planet has the shortest day, rotating in about 10 hours?","a":"Jupiter","w":["Earth","Mars","Neptune"],"cat":"Science"},{"q":"What is the value of pi rounded to two decimal places?","a":"3.14","w":["3.12","3.16","3.41"],"cat":"Mathematics"},{"q":"In Greek mythology, who flew too close to the Sun on wax wings?","a":"Icarus","w":["Daedalus","Perseus","Theseus"],"cat":"Mythology"},{"q":"Who wrote Crime and Punishment?","a":"Fyodor Dostoevsky","w":["Leo Tolstoy","Nikolai Gogol","Boris Pasternak"],"cat":"Literature"},{"q":"Who composed the opera The Marriage of Figaro?","a":"Wolfgang Amadeus Mozart","w":["Ludwig van Beethoven","Giuseppe Verdi","Richard Wagner"],"cat":"Music"},{"q":"Which gas is chiefly responsible for the intense greenhouse effect on Venus?","a":"Carbon dioxide","w":["Methane","Oxygen","Nitrogen"],"cat":"Science"},{"q":"What is the currency of South Korea?","a":"Won","w":["Yen","Yuan","Baht"],"cat":"Geography"},{"q":"Which scientist formulated the three laws of motion?","a":"Isaac Newton","w":["Albert Einstein","Galileo Galilei","Johannes Kepler"],"cat":"Science"},{"q":"Who wrote the novel War and Peace?","a":"Leo Tolstoy","w":["Fyodor Dostoevsky","Anton Chekhov","Ivan Turgenev"],"cat":"Literature"},{"q":"What is the capital of New Zealand?","a":"Wellington","w":["Auckland","Christchurch","Hamilton"],"cat":"Geography"},{"q":"What is the chemical symbol for the element tungsten?","a":"W","w":["Tu","Tg","Tn"],"cat":"Science"},{"q":"What is the largest internal organ in the human body?","a":"Liver","w":["Brain","Lungs","Stomach"],"cat":"Science"},{"q":"Which Wonder of the Ancient World stood in the harbor of Alexandria?","a":"The Lighthouse of Alexandria","w":["The Hanging Gardens","The Colossus of Rhodes","The Great Pyramid"],"cat":"History"},{"q":"What is the square root of 144?","a":"12","w":["14","16","11"],"cat":"Mathematics"},{"q":"What is the capital of Mongolia?","a":"Ulaanbaatar","w":["Astana","Tashkent","Bishkek"],"cat":"Geography"},{"q":"Which painter famously cut off part of his own ear?","a":"Vincent van Gogh","w":["Paul Gauguin","Edgar Degas","Edouard Manet"],"cat":"Art"},{"q":"Which part of the cell is known as its powerhouse?","a":"Mitochondria","w":["Nucleus","Ribosome","Golgi apparatus"],"cat":"Science"},{"q":"What is the longest bone in the human body?","a":"Femur","w":["Tibia","Humerus","Fibula"],"cat":"Science"},{"q":"Which country has the longest coastline in the world?","a":"Canada","w":["Russia","Australia","Indonesia"],"cat":"Geography"},{"q":"Who wrote the Divine Comedy?","a":"Dante Alighieri","w":["Geoffrey Chaucer","Petrarch","Boccaccio"],"cat":"Literature"},{"q":"In which year did the United States declare independence?","a":"1776","w":["1775","1789","1812"],"cat":"History"},{"q":"Who painted the ceiling of the Sistine Chapel?","a":"Michelangelo","w":["Leonardo da Vinci","Raphael","Botticelli"],"cat":"Art"},{"q":"In what year did the Titanic sink?","a":"1912","w":["1905","1918","1920"],"cat":"History"},{"q":"Which element has the atomic number 1?","a":"Hydrogen","w":["Helium","Oxygen","Carbon"],"cat":"Science"},{"q":"What is the chemical symbol for potassium?","a":"K","w":["P","Po","Pt"],"cat":"Science"},{"q":"Who was the first Emperor of Rome?","a":"Augustus","w":["Julius Caesar","Nero","Caligula"],"cat":"History"},{"q":"How many lines are there on a standard musical staff?","a":"Five","w":["Four","Six","Seven"],"cat":"Music"},{"q":"What is the smallest prime number?","a":"2","w":["1","3","0"],"cat":"Mathematics"}]};

/* one question -> playable shape (choice order randomized per view) */
const toQ = (it, diff) => ({ q:it.q, correct:it.a, choices:shuffle([it.a].concat(it.w)), cat:it.cat, difficulty:diff });
/* deterministic window into a difficulty pool for a given day number */
function windowPick(arr, count, mult, dayNum){
  const out=[], start=((dayNum*mult)%arr.length + arr.length)%arr.length;
  for(let i=0;i<count;i++) out.push(arr[(start+i)%arr.length]);
  return out;
}
/* the 6-question set for a given day number: 3 easy, 2 medium, 1 hard */
function daySet(dayNum){
  return windowPick(BANK.easy,3,3,dayNum).map(x=>toQ(x,"easy"))
    .concat(windowPick(BANK.medium,2,2,dayNum).map(x=>toQ(x,"medium")))
    .concat(windowPick(BANK.hard,1,1,dayNum).map(x=>toQ(x,"hard")));
}
/* a random extra set (not tied to the calendar) */
function practiceSet(){
  const r=(arr,n)=>shuffle(arr).slice(0,n);
  return r(BANK.easy,3).map(x=>toQ(x,"easy"))
    .concat(r(BANK.medium,2).map(x=>toQ(x,"medium")))
    .concat(r(BANK.hard,1).map(x=>toQ(x,"hard")));
}

/* =========================================================================
   Round
   ========================================================================= */
let roundQs=[], idx=0, score=0, results=[], answered=false, isDaily=true;
function beginRound(qs, daily){
  roundQs=qs; idx=0; score=0; results=[]; isDaily=daily;
  roundIlls=shuffle(ALL_ILLS);
  el("brandMini").innerHTML=miniBrain()+'<span>BRAIN DAY</span>';
  renderSegs(); show("s-play"); renderQuestion();
}
function renderSegs(){ const s=el("segs"); s.innerHTML=""; for(let i=0;i<roundQs.length;i++) s.appendChild(make("span","seg")); }
function paintSegs(){ document.querySelectorAll("#segs .seg").forEach((s,i)=>{ s.className="seg";
  if(i<results.length) s.classList.add(results[i]?"got":"missed"); else if(i===idx) s.classList.add("cur"); }); }
function renderQuestion(){
  show("s-play");
  answered=false; const cur=roundQs[idx];
  el("runscore").textContent="\u2713 "+score;
  el("chipCat").textContent=cur.cat;
  const diff=el("chipDiff");
  diff.textContent=cur.difficulty?cur.difficulty[0].toUpperCase()+cur.difficulty.slice(1):"";
  diff.className="chip"+(cur.difficulty?" diff-"+cur.difficulty:""); diff.style.display=cur.difficulty?"":"none";
  const qt=el("qText"); qt.textContent=cur.q; qt.classList.remove("anim"); void qt.offsetWidth; qt.classList.add("anim");
  paintSegs();
  const box=el("choices"); box.innerHTML=""; const letters=["A","B","C","D"];
  cur.choices.forEach((c,i)=>{ const b=make("button","choice"); b.type="button";
    b.appendChild(make("span","key",letters[i]||"")); b.appendChild(make("span","txt",c));
    b.onclick=()=>choose(b,c); box.appendChild(b); });
  const nb=el("nextBtn"); nb.classList.add("hidden");
  nb.textContent=(idx===roundQs.length-1)?"FINISH SET":"NEXT REP";
}
function choose(btn, choice){
  if(answered) return; answered=true;
  const cur=roundQs[idx], correct=choice===cur.correct;
  results.push(correct); if(correct) score++;
  el("runscore").textContent="\u2713 "+score;
  document.querySelectorAll("#choices .choice").forEach(b=>{ b.disabled=true;
    const t=b.querySelector(".txt").textContent;
    if(t===cur.correct) b.classList.add("correct"); else if(b===btn) b.classList.add("wrong"); else b.classList.add("dim"); });
  paintSegs(); el("nextBtn").classList.remove("hidden");
}
function next(){ showTransition(idx, ()=>{ if(idx<roundQs.length-1){ idx++; renderQuestion(); } else finishRound(); }); }
function finishRound(){
  if(isDaily){ store.days[currentDayId]={done:true,score,total:roundQs.length,results:results.slice()}; save(); showResults(store.days[currentDayId],true); }
  else showResults({score,total:roundQs.length,results:results.slice()},false);
}

/* transition */
const GOOD=["Clean rep!","Nice lift.","That's a PR pace.","Strong set.","Feel the burn.","Locked in."];
const MISS=["Shake it off, next set.","Every rep counts.","No skipping \u2014 push on.","Reset and go again.","Warm-up wobble. Keep going."];
let transTimer=null, transCb=null;
function showTransition(i, cb){
  transCb=cb;
  el("transIll").innerHTML=roundIlls[i % roundIlls.length]();
  el("transRep").textContent="REP "+(i+1)+" / "+roundQs.length;
  el("transLine").textContent=results[i]?pick(GOOD):pick(MISS);
  show("s-transition");
  if(transTimer) clearTimeout(transTimer);
  transTimer=setTimeout(advanceTrans, reduced()?450:850);
}
function advanceTrans(){ if(transTimer){ clearTimeout(transTimer); transTimer=null; } const cb=transCb; transCb=null; if(cb) cb(); }

/* =========================================================================
   Results
   ========================================================================= */
function currentStreak(){
  let d=parseYmd(latestDayId||todayKey);
  if(!(store.days[ymd(d)] && store.days[ymd(d)].done)) d.setDate(d.getDate()-1);
  let n=0; while(store.days[ymd(d)] && store.days[ymd(d)].done){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function bestStreak(){
  const dates=Object.keys(store.days).filter(k=>store.days[k].done).sort();
  let best=0, run=0, prev=null;
  dates.forEach(k=>{ if(prev){ run=((new Date(k)-new Date(prev))===86400000)?run+1:1; } else run=1; if(run>best) best=run; prev=k; });
  store.best=Math.max(store.best||0,best); return store.best;
}
function verdict(g,t){ const p=g/t;
  if(p===1) return "PERSONAL BEST \u2014 total brain gains.";
  if(p>=0.8) return "Strong set. One more rep next time.";
  if(p>=0.6) return "Solid workout.";
  if(p>=0.4) return "Decent warm-up. Keep training.";
  return "Rough set \u2014 but you showed up. That counts."; }
let countdownTimer=null;
function showResults(rec, daily){
  const g=rec.score, t=rec.total, ratio=g/t;
  const isToday = currentDayId===latestDayId;
  el("rIll").innerHTML = ratio>=0.6 ? illWin() : illRest();
  el("rEyebrow").textContent = !daily ? "EXTRA SET" : (isToday ? "TODAY'S WORKOUT" : fmtShort(currentDayId).toUpperCase());
  el("rScore").innerHTML=g+'<span class="of"> / '+t+'</span>';
  el("rScore").style.color = ratio>=0.6 ? "var(--got)" : (ratio>=0.4 ? "var(--brain-2)" : "var(--missed)");
  el("rVerdict").textContent=verdict(g,t);
  el("rSquares").textContent=rec.results.map(r=>r?"\uD83D\uDFE9":"\uD83D\uDFE5").join("");
  const streak=currentStreak(), best=bestStreak(); save();
  el("rStats").innerHTML=
    '<div class="stat"><div class="n">'+streak+'</div><div class="l">Day streak</div></div>'+
    '<div class="stat"><div class="n">'+best+'</div><div class="l">Best streak</div></div>';
  const actions=el("rActions"); actions.innerHTML="";
  const shareBtn=make("button","btn primary","SHARE YOUR GAINS");
  shareBtn.onclick=()=>shareResult(g,t,rec.results,shareBtn); actions.appendChild(shareBtn);
  const pastBtn=make("button","btn ghost","PAST DAYS"); pastBtn.onclick=openArchive; actions.appendChild(pastBtn);
  const practiceBtn=make("button","btn ghost","EXTRA SET"); practiceBtn.onclick=startPractice; actions.appendChild(practiceBtn);
  const cd=el("rCountdown");
  if(daily && isToday){
    cd.style.display="";
    if(countdownTimer) clearInterval(countdownTimer);
    const tick=()=>{ const mid=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,0);
      let s=Math.max(0,Math.floor((mid-new Date())/1000));
      const h=String(Math.floor(s/3600)).padStart(2,"0"); s%=3600;
      const m=String(Math.floor(s/60)).padStart(2,"0"), ss=String(s%60).padStart(2,"0");
      cd.innerHTML="Next brain day in <b>"+h+":"+m+":"+ss+"</b>"; };
    tick(); countdownTimer=setInterval(tick,1000);
  } else cd.style.display="none";
  show("s-result");
}

/* ---------- archive (play days you missed) ---------- */
function openArchive(){
  const list=el("archiveList"); list.innerHTML="";
  const startNum=dayNumOf(ARCHIVE_START), todayNum=dayNumOf(todayKey);
  const from=todayNum, to=Math.max(startNum, todayNum-(ARCHIVE_MAX_ROWS-1));
  for(let n=from; n>=to; n--){
    const d=dayIdOf(n), rec=store.days[d];
    const row=make("button","archive-row");
    row.appendChild(make("div","ar-date", fmtShort(d) + (d===todayKey?"  \u00b7 today":"")));
    const right=make("div","ar-status");
    if(rec && rec.done){ right.textContent=rec.score+"/"+rec.total+" \u2713"; right.classList.add("done"); }
    else { right.textContent=(d===todayKey?"Play \u203A":"Play \u203A"); }
    row.appendChild(right);
    row.onclick=()=>playDay(d);
    list.appendChild(row);
  }
  show("s-archive");
}
function playDay(d){
  currentDayId=d;
  if(store.days[d] && store.days[d].done){ showResults(store.days[d], true); return; }
  beginRound(daySet(dayNumOf(d)), true);
}
function backToToday(){
  currentDayId=latestDayId;
  if(store.days[latestDayId] && store.days[latestDayId].done){ showResults(store.days[latestDayId], true); }
  else startDaily();
}
async function shareResult(g,t,res,btn){
  const squares=res.map(r=>r?"\uD83D\uDFE9":"\uD83D\uDFE5").join("");
  const text="Don't Skip Brain Day \uD83E\uDDE0 \u2014 "+now.toLocaleDateString()+"\n"+g+"/"+t+" "+squares+"\n"+location.href;
  try{ if(navigator.share){ await navigator.share({text}); return; } await navigator.clipboard.writeText(text); }
  catch(e){ try{ await navigator.clipboard.writeText(text); }catch(e2){} }
  const old=btn.textContent; btn.textContent="COPIED \u2713"; btn.classList.add("copied");
  setTimeout(()=>{ btn.textContent=old; btn.classList.remove("copied"); },1600);
}

/* =========================================================================
   Flows
   ========================================================================= */
let lastFlow=null;
function startDaily(){
  lastFlow=startDaily;
  latestDayId=todayKey; currentDayId=todayKey;
  if(store.days[todayKey] && store.days[todayKey].done){ showResults(store.days[todayKey],true); return; }
  beginRound(daySet(dayNumOf(todayKey)), true);
}
function startPractice(){
  lastFlow=startPractice;
  currentDayId=latestDayId;
  beginRound(practiceSet(), false);
}
function retry(){ (lastFlow||startDaily)(); }
function showError(){
  el("errIll").innerHTML=illShrug();
  el("errMsg").textContent = navigator.onLine
    ? "Couldn't load today's workout. Check your connection and give it another go."
    : "You're offline. Reconnect to load today's workout \u2014 your streak is safe.";
  show("s-error");
}

/* Offline support + always-newest shell */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

startDaily();
</script>
